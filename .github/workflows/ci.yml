name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Run ruff
        run: ruff check apps/ libs/
        
      - name: Run black
        run: black --check apps/ libs/
        
      - name: Run mypy
        run: mypy apps/ libs/
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inka
          POSTGRES_PASSWORD: inka
          POSTGRES_DB: inka_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Run tests
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov --cov-report=xml
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Export coverage percentage for quality gate
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib.get('line-rate', 0)) * 100
          print(f'{rate:.2f}')
          ")
          echo "COVERAGE_PCT=${COVERAGE}" >> $GITHUB_ENV

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Compute coverage for gate
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-report=xml -q || true
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib.get('line-rate', 0)) * 100
          print(f'{rate:.2f}')
          ")
          echo "COVERAGE_PCT=${COVERAGE}" >> $GITHUB_ENV
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_test
          REDIS_URL: redis://localhost:6379/0
        continue-on-error: true

      - name: Run Quality Gate (Stage)
        run: |
          python scripts/quality_gate.py \
            --target stage \
            --version "${{ github.ref_name }}" \
            --output-json quality_report.json
        env:
          COVERAGE_PCT: ${{ env.COVERAGE_PCT }}
          GITHUB_SHA: ${{ github.sha }}
          # Override these via repository secrets / workflow inputs for real values:
          OPEN_S1_BUGS: ${{ vars.OPEN_S1_BUGS || '0' }}
          OPEN_S2_BUGS: ${{ vars.OPEN_S2_BUGS || '0' }}
          CRITICAL_VULNS: ${{ vars.CRITICAL_VULNS || '0' }}
          HIGH_VULNS: ${{ vars.HIGH_VULNS || '0' }}
          MIGRATION_RISK_LEVEL: ${{ vars.MIGRATION_RISK_LEVEL || '0' }}
          CODE_CHURN_PCT: ${{ vars.CODE_CHURN_PCT || '0' }}
          COMPLIANCE_SCORE: ${{ vars.COMPLIANCE_SCORE || '100' }}
          CI_LINT_PASSED: 'true'
          CI_TESTS_PASSED: 'true'

      - name: Upload Quality Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality_report.json
