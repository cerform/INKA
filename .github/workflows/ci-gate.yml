name: CI Gate

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  COVERAGE_THRESHOLD: 80
  REGION: europe-west1

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Format
  # ─────────────────────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e .[dev]

      - name: Ruff lint
        run: ruff check apps/ libs/

      - name: Ruff format check
        run: ruff format --check apps/ libs/

      - name: Black format check
        run: black --check apps/ libs/

      - name: Mypy type check
        run: mypy apps/ libs/

  # ─────────────────────────────────────────
  # JOB 2: Full Test Suite + Coverage Gate
  # ─────────────────────────────────────────
  test:
    name: "Test Suite + Coverage"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inka
          POSTGRES_PASSWORD: inka
          POSTGRES_DB: inka_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run migrations on test DB
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_test
        run: alembic -c libs/database/alembic.ini upgrade head

      - name: Run full test suite with coverage gate
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: |
          pytest \
            --cov=apps --cov=libs \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -v --tb=short

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  # ─────────────────────────────────────────
  # JOB 3: Version Bump Enforcement
  # ─────────────────────────────────────────
  version-check:
    name: "Version Bump Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install toml parser
        run: pip install tomli

      - name: Check version was bumped
        run: python scripts/version_check.py

  # ─────────────────────────────────────────
  # JOB 4: Container Build + Vulnerability Scan
  # ─────────────────────────────────────────
  build-and-scan:
    name: "Build & Scan (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [api, bot, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t inka-${{ matrix.service }}:scan \
            -f apps/${{ matrix.service }}/Dockerfile \
            --label "git.sha=${{ github.sha }}" \
            --label "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inka-${{ matrix.service }}:scan
          format: "json"
          output: trivy-${{ matrix.service }}.json
          severity: "CRITICAL,HIGH"
          exit-code: "1"        # FAIL on CRITICAL
          ignore-unfixed: false

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inka-${{ matrix.service }}:scan
          format: "cyclonedx"
          output: sbom-${{ matrix.service }}.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.xml

  # ─────────────────────────────────────────
  # JOB 5: Migration Safety Check
  # ─────────────────────────────────────────
  migration-check:
    name: "Migration Safety Check"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inka
          POSTGRES_PASSWORD: inka
          POSTGRES_DB: inka_migrate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Check for new migration files
        id: check_migrations
        run: |
          CHANGED=$(git diff --name-only origin/main HEAD -- 'libs/database/alembic/versions/*.py' | wc -l)
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT

      - name: Run migration safety check
        if: steps.check_migrations.outputs.changed > 0
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_migrate_test
        run: python scripts/check_migrations.py

      - name: Test upgrade + downgrade cycle
        if: steps.check_migrations.outputs.changed > 0
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_migrate_test
        run: |
          alembic -c libs/database/alembic.ini upgrade head
          alembic -c libs/database/alembic.ini downgrade -1
          alembic -c libs/database/alembic.ini upgrade head

  # ─────────────────────────────────────────
  # JOB 6: Changelog Check
  # ─────────────────────────────────────────
  changelog-check:
    name: "Changelog Updated"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was updated
        run: |
          if ! git diff --name-only origin/main HEAD | grep -q "CHANGELOG.md"; then
            echo "❌ CHANGELOG.md was not updated. Update it before merging."
            exit 1
          fi
          echo "✅ CHANGELOG.md updated."

  # ─────────────────────────────────────────
  # GATE SUMMARY — all jobs must pass
  # ─────────────────────────────────────────
  gate-summary:
    name: "✅ Deployment Gate"
    runs-on: ubuntu-latest
    needs: [lint, test, version-check, build-and-scan, migration-check, changelog-check]
    if: always()
    steps:
      - name: Evaluate gate result
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-scan.result }}" != "success" ]] || \
             [[ "${{ needs.migration-check.result }}" != "success" ]]; then
            echo "🔴 DEPLOYMENT GATE FAILED"
            exit 1
          fi
          echo "🟢 DEPLOYMENT GATE PASSED — all checks clear"
