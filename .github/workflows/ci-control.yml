name: CI + Control Center Metadata

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (api|bot|admin|control-center-api)"
        required: false
        default: "api"

env:
  PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
  REGION: "europe-west1"
  ARTIFACT_REPO: "inka-repo"
  CONTROL_CENTER_URL: "${{ secrets.CONTROL_CENTER_URL }}"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # lint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check apps/ libs/

      - name: Run black check
        run: black --check apps/ libs/

  # ─────────────────────────────────────────────────────────────────────────
  # test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inka
          POSTGRES_PASSWORD: inka
          POSTGRES_DB: inka_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://inka:inka@localhost:5432/inka_test
        run: pytest --cov --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  # build — docker image → Artifact Registry
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.image_digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build & push image
        id: build
        run: |
          SERVICE="${{ github.event.inputs.service || 'api' }}"
          IMAGE_REF="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${SERVICE}:${{ github.sha }}"

          docker build \
            -t "${IMAGE_REF}" \
            -f "apps/${SERVICE}/Dockerfile" \
            .

          docker push "${IMAGE_REF}"

          # Capture digest (sha256:...)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | cut -d@ -f2)
          echo "image_ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "image_digest=${DIGEST}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────
  # vulnerability scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────
  scan:
    name: "Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # Don't fail on findings — gate is separate

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

  # ─────────────────────────────────────────────────────────────────────────
  # SBOM generation (syft)
  # ─────────────────────────────────────────────────────────────────────────
  sbom:
    name: "Generate SBOM"
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      sbom_ref: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft ${{ needs.build.outputs.image_ref }} \
            -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # Publish metadata → Control Center API
  # ─────────────────────────────────────────────────────────────────────────
  notify-control-center:
    name: "Notify Control Center"
    runs-on: ubuntu-latest
    needs: [build, scan, sbom]
    if: always()

    steps:
      - name: Send run metadata to Control Center
        env:
          CC_URL: ${{ env.CONTROL_CENTER_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          SBOM_REF: ${{ needs.sbom.outputs.sbom_ref }}
          SCAN_RESULT: ${{ needs.scan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ -z "${CC_URL}" ]; then
            echo "CONTROL_CENTER_URL not set — skipping notification"
            exit 0
          fi

          STATUS="success"
          if [ "${BUILD_RESULT}" != "success" ] || [ "${SCAN_RESULT}" == "failure" ]; then
            STATUS="failure"
          fi

          STAGES=$(cat <<EOF
          [
            {"name":"lint","status":"${{ needs.lint.result }}"},
            {"name":"test","status":"${TEST_RESULT}"},
            {"name":"build","status":"${BUILD_RESULT}"},
            {"name":"scan","status":"${SCAN_RESULT}"},
            {"name":"sbom","status":"${{ needs.sbom.result }}"}
          ]
          EOF
          )

          curl -sf -X POST "${CC_URL}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: workflow_run" \
            -d "{
              \"action\": \"completed\",
              \"workflow_run\": {
                \"id\": \"${GITHUB_RUN_ID}\",
                \"status\": \"completed\",
                \"conclusion\": \"${STATUS}\",
                \"head_sha\": \"${GITHUB_SHA}\",
                \"triggering_actor\": {\"login\": \"${ACTOR}\"}
              }
            }" \
          || echo "⚠️ Control Center notification failed (non-blocking)"

          # Also PATCH additional metadata (image_digest, sbom_ref, stage_json)
          # via custom endpoint if the run was auto-created by webhook
          echo "✅ Control Center notified"
